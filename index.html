<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Hub: Abs & Boxing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .card { background-color: #1e293b; border: 1px solid #334155; }
        input[type="checkbox"]:checked + label { text-decoration: line-through; color: #64748b; }
        .tab-active { color: #3b82f6; border-bottom: 2px solid #3b82f6; }
        .animate-fade-in { animation: fadeIn 0.2s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-2xl mx-auto">
        
        <nav class="flex justify-center gap-8 mb-10 border-b border-slate-800 pb-4 text-xs font-black uppercase tracking-[0.2em]">
            <button id="nav-abs" onclick="setTab('abs')" class="pb-2 transition-all">Abs Challenge</button>
            <button id="nav-boxing" onclick="setTab('boxing')" class="pb-2 transition-all">Boxing Training</button>
        </nav>

        <div id="main-content" class="animate-fade-in">
            </div>

        <div class="mt-12 border-t border-slate-800 pt-8">
            <h3 id="history-title" class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-6 text-center">Consistency History</h3>
            <div id="history-list" class="grid grid-cols-5 gap-3 md:grid-cols-10">
                </div>
        </div>

        <div class="mt-12 flex flex-col items-center gap-4">
            <button onclick="resetCurrentApp()" class="text-[10px] text-slate-600 hover:text-red-400 font-bold uppercase tracking-widest transition">
                Reset Current Program
            </button>
        </div>
    </div>

    <script>
        // DATA: Abs Challenge
        const abData = [
            { day: 1, sit: "10", flutter: "20", plank: "30s" }, { day: 2, sit: "14", flutter: "40", plank: "40s" },
            { day: 3, sit: "16", flutter: "60", plank: "45s" }, { day: 4, sit: "20", flutter: "20", plank: "20s", rest: true },
            { day: 5, sit: "24", flutter: "80", plank: "50s" }, { day: 6, sit: "26", flutter: "100 (5 sets of 20)", plank: "1m" },
            { day: 7, sit: "28", flutter: "110 (5 sets of 22)", plank: "1m 10s" }, { day: 8, sit: "20", flutter: "20", plank: "20s", rest: true },
            { day: 9, sit: "30", flutter: "120 (5 sets of 24)", plank: "1m 20s" }, { day: 10, sit: "32", flutter: "130 (5 sets of 26)", plank: "1m 30s" },
            { day: 11, sit: "34 (2 sets of 17)", flutter: "140 (5 sets of 28)", plank: "1m 40s" }, { day: 12, sit: "20", flutter: "20", plank: "20s", rest: true },
            { day: 13, sit: "36 (2 sets of 18)", flutter: "150 (5 sets of 30)", plank: "1m 45s" }, { day: 14, sit: "38 (2 sets of 19)", flutter: "160 (5 sets of 32)", plank: "1m 50s" },
            { day: 15, sit: "40 (2 sets of 20)", flutter: "180 (5 sets of 36)", plank: "2m (2 sets of 1m)" }, { day: 16, sit: "20", flutter: "20", plank: "20s", rest: true },
            { day: 17, sit: "42 (2 sets of 21)", flutter: "190 (5 sets of 38)", plank: "2m 10s (2 sets of 65s)" }, { day: 18, sit: "44 (2 sets of 22)", flutter: "200 (5 sets of 40)", plank: "2m 20s (2 sets of 70s)" },
            { day: 19, sit: "46 (2 sets of 23)", flutter: "210 (5 sets of 42)", plank: "2m 30s (2 sets of 75s)" }, { day: 20, sit: "20", flutter: "20", plank: "20s", rest: true },
            { day: 21, sit: "50 (2 sets of 25)", flutter: "220 (5 sets of 44)", plank: "2m 40s (2 sets of 80s)" }, { day: 22, sit: "52 (2 sets of 26)", flutter: "230 (5 sets of 46)", plank: "2m 50s (2 sets of 85s)" },
            { day: 23, sit: "54 (2 sets of 27)", flutter: "240 (5 sets of 48)", plank: "3m (3 sets of 1m)" }, { day: 24, sit: "20", flutter: "20", plank: "20s", rest: true },
            { day: 25, sit: "60 (2 sets of 30)", flutter: "250 (5 sets of 50)", plank: "3m 10s (3 sets of 63s)" }, { day: 26, sit: "62 (2 sets of 31)", flutter: "260 (5 sets of 52)", plank: "3m 20s (4 sets of 50s)" },
            { day: 27, sit: "64 (2 sets of 32)", flutter: "280 (5 sets of 56)", plank: "3m 30s (3 sets of 70s)" }, { day: 28, sit: "20", flutter: "20", plank: "20s", rest: true },
            { day: 29, sit: "68 (2 sets of 34)", flutter: "290 (5 sets of 58)", plank: "3m 40s (4 sets of 55s)" }, { day: 30, sit: "70 (2 sets of 35)", flutter: "300 (5 sets of 60)", plank: "4m (4 sets of 1m)" }
        ];

        // DATA: Boxing Routine
        const boxingData = [
            { id: "b1", title: "Warm Up Set 1", desc: "2 Mins: Straights, Hooks, Uppercuts. Last 10s: Burnout Fast Punches!" },
            { id: "b2", title: "Warm Up Set 2", desc: "2 Mins: Straights, Hooks, Uppercuts. Last 10s: Burnout Fast Punches!" },
            { id: "b3", title: "1st Combo (2 Mins)", desc: "Jab, Cross, Hook, Cross" },
            { id: "b4", title: "2nd Combo (2 Mins)", desc: "Jab, Cross, R-Uppercut, L-Hook" },
            { id: "b5", title: "3rd Combo", desc: "Double Jab, Cross" },
            { id: "b6", title: "4th Combo", desc: "Jab, Cross, Hook, Hook" }
        ];

        // STATE MANAGEMENT
        let currentTab = localStorage.getItem('activeTab') || 'abs';
        
        // Abs State
        let abDay = parseInt(localStorage.getItem('abDay')) || 1;
        let abHistory = JSON.parse(localStorage.getItem('abHistory')) || [];
        
        // Boxing State
        let boxingHistory = JSON.parse(localStorage.getItem('boxingHistory')) || [];

        function setTab(tab) {
            currentTab = tab;
            localStorage.setItem('activeTab', tab);
            render();
        }

        function render() {
            const main = document.getElementById('main-content');
            const historyList = document.getElementById('history-list');
            const historyTitle = document.getElementById('history-title');

            // Update Nav Classes
            document.getElementById('nav-abs').className = `pb-2 transition-all ${currentTab === 'abs' ? 'tab-active' : 'text-slate-500'}`;
            document.getElementById('nav-boxing').className = `pb-2 transition-all ${currentTab === 'boxing' ? 'tab-active' : 'text-slate-500'}`;

            if (currentTab === 'abs') {
                historyTitle.innerText = "Abs Challenge History";
                renderAbs(main);
                renderHistory(historyList, abHistory, abDay, 30);
            } else {
                historyTitle.innerText = "Boxing Session History";
                renderBoxing(main);
                renderHistory(historyList, boxingHistory, null, 30); // Using 30 generic slots for streak tracking
            }
        }

        // RENDER: ABS APP
        function renderAbs(container) {
            const data = abData[abDay - 1];
            if (abDay > 30) {
                container.innerHTML = `<div class="card p-10 rounded-3xl text-center shadow-2xl">🏆 <h2 class="text-2xl font-black text-green-400 mt-2">CHALLENGE COMPLETE!</h2></div>`;
                return;
            }
            container.innerHTML = `
                <div class="card p-6 md:p-8 rounded-3xl animate-fade-in shadow-2xl">
                    <div class="flex justify-between items-center mb-8">
                        <span class="bg-blue-900/40 text-blue-400 text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-widest border border-blue-500/20">${data.rest ? 'Rest' : 'Work'}</span>
                        <h2 class="text-2xl font-black italic">DAY ${abDay}</h2>
                    </div>
                    <div class="space-y-6">
                        ${renderCheckbox("Sit-ups", data.sit)}
                        ${renderCheckbox("Flutter Kicks", data.flutter)}
                        ${renderCheckbox("Plank", data.plank)}
                    </div>
                    <button onclick="finishAbDay()" class="w-full mt-10 bg-blue-600 py-5 rounded-2xl font-black text-xl shadow-xl shadow-blue-600/20 uppercase">Complete Workout</button>
                </div>
                <div class="flex justify-between mt-4 px-2 text-[10px] font-black text-slate-600 uppercase">
                    <button onclick="moveAbDay(-1)" ${abDay === 1 ? 'class="opacity-0"' : ''}>← Previous</button>
                    <button onclick="moveAbDay(1)" ${abDay === 30 ? 'class="opacity-0"' : ''}>Skip →</button>
                </div>`;
        }

        // RENDER: BOXING APP
        function renderBoxing(container) {
            container.innerHTML = `
                <div class="card p-6 md:p-8 rounded-3xl animate-fade-in shadow-2xl">
                    <div class="flex justify-between items-center mb-8">
                        <span class="bg-red-900/40 text-red-400 text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-widest border border-red-500/20">Heavy Bag / Pads</span>
                        <h2 class="text-2xl font-black italic uppercase">Boxing Drills</h2>
                    </div>
                    <div class="space-y-5">
                        ${boxingData.map(item => `
                            <div class="group">
                                <h3 class="text-slate-500 text-[9px] font-black uppercase tracking-widest mb-2">${item.title}</h3>
                                <div class="flex items-start gap-4 bg-slate-900/40 p-4 rounded-xl border border-white/5">
                                    <input type="checkbox" id="${item.id}" class="mt-1 w-5 h-5 rounded bg-slate-800 border-slate-700 text-red-500 focus:ring-0">
                                    <label for="${item.id}" class="text-md font-bold leading-tight">${item.desc}</label>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <button onclick="finishBoxingSession()" class="w-full mt-10 bg-red-600 py-5 rounded-2xl font-black text-xl shadow-xl shadow-red-600/20 uppercase">Finish Session</button>
                </div>`;
        }

        function renderCheckbox(name, val) {
            return `<div><h3 class="text-slate-500 text-[9px] font-black uppercase mb-2">${name}</h3>
                    <div class="flex items-center gap-4 bg-slate-900/40 p-4 rounded-xl border border-white/5">
                    <input type="checkbox" id="${name}" class="w-6 h-6 rounded bg-slate-800 border-slate-700 text-blue-600 focus:ring-0">
                    <label for="${name}" class="text-lg font-bold">${val}</label></div></div>`;
        }

        function renderHistory(list, history, currentDay, totalSlots) {
            list.innerHTML = '';
            for (let i = 1; i <= totalSlots; i++) {
                const isFinished = history.includes(i);
                const isToday = i === currentDay;
                let colorClass = isFinished ? 'bg-green-500 border-green-500 text-slate-900' : 'border-slate-800 text-slate-700 bg-slate-900/50';
                if (isToday) colorClass = 'border-blue-500 text-blue-500 animate-pulse';
                list.innerHTML += `<div class="w-full aspect-square rounded-lg border-2 flex items-center justify-center text-[10px] font-bold ${colorClass}">${isFinished ? '✓' : i}</div>`;
            }
        }

        // ACTIONS
        function finishAbDay() {
            if (!abHistory.includes(abDay)) abHistory.push(abDay);
            localStorage.setItem('abHistory', JSON.stringify(abHistory));
            abDay++;
            localStorage.setItem('abDay', abDay);
            render();
        }

        function finishBoxingSession() {
            const nextSessionIdx = boxingHistory.length + 1;
            if (nextSessionIdx <= 30) {
                boxingHistory.push(nextSessionIdx);
                localStorage.setItem('boxingHistory', JSON.stringify(boxingHistory));
            }
            alert("Boxing Session Logged! Great work.");
            render();
        }

        function moveAbDay(delta) {
            abDay += delta;
            localStorage.setItem('abDay', abDay);
            render();
        }

        function resetCurrentApp() {
            if (!confirm("Reset progress for this program?")) return;
            if (currentTab === 'abs') {
                abDay = 1; abHistory = [];
                localStorage.removeItem('abDay'); localStorage.removeItem('abHistory');
            } else {
                boxingHistory = [];
                localStorage.removeItem('boxingHistory');
            }
            render();
        }

        render();
    </script>
</body>
</html>
